<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>どうぶつチェス 🐱♟️</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" type="image/png" href="favicon.png">
<!-- ?v= is a cache-busting version; increment it whenever the file contents change. / ?v= は更新時にキャッシュを切り替える版数。内容を変えたら増やす。 -->
<link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>

<header class="app-header">
  <h1 data-i18n="app.title">🐱 どうぶつチェス <span class="sub">Animal Chess</span></h1>
  <div class="header-btns">
    <select id="sel-language" class="language-select" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
    <button id="btn-bgm" class="icon-btn" data-i18n-title="ui.bgmToggle" title="BGM切り替え">🎵</button>
    <button id="btn-sound" class="icon-btn" data-i18n-title="ui.soundToggle" title="効果音切り替え">🔊</button>
  </div>
</header>

<main class="layout">

  <!-- Left: board area / 左: 盤面エリア -->
  <section class="board-col">
    <div id="venue-top" class="venue">
      <div class="venue-title"></div>
      <div class="venue-guests"></div>
    </div>

    <div class="board-wrap" id="board-wrap">
      <div id="board" class="board"></div>
      <div id="overlay" class="overlay"></div>
    </div>

    <div id="venue-bottom" class="venue">
      <div class="venue-title"></div>
      <div class="venue-guests"></div>
    </div>

    <div id="status-bar" class="status-bar"></div>
  </section>

  <!-- Right: information column / 右: 情報列 -->
  <div class="side-col">

    <!-- Study and replay panel, shared by every tab / 学習・棋譜再生パネル。どのタブからも共通で開く。 -->
    <div id="study-panel" class="study-panel hidden">
      <div class="study-head">
        <span id="study-title" class="study-title"></span>
        <button id="btn-study-close" class="icon-btn small" data-i18n-title="ui.close" title="とじる">✖</button>
      </div>
      <div id="study-meta" class="study-meta"></div>
      <div id="study-note" class="study-note"></div>
      <div class="study-nav">
        <button id="btn-replay-first" class="btn small" data-i18n-title="ui.first" title="さいしょ">⏮</button>
        <button id="btn-replay-prev" class="btn small" data-i18n-title="ui.previous" title="まえ">◀</button>
        <span id="replay-counter" class="replay-counter">0 / 0</span>
        <button id="btn-replay-next" class="btn small" data-i18n-title="ui.next" title="つぎ">▶</button>
        <button id="btn-replay-last" class="btn small" data-i18n-title="ui.last" title="さいご">⏭</button>
        <button id="btn-replay-play" class="btn primary" data-i18n="ui.playFromHere">🎮 ここから対局</button>
      </div>
      <ol id="replay-movelist" class="movelist study-moves"></ol>
    </div>

    <!-- Upper right: settings card / 右上: 設定カード -->
    <section class="panel card-settings">
      <nav class="tabs">
        <button class="tab active" data-tab="settings" data-group="ctrl" data-i18n="tab.settings">⚙️ 設定</button>
        <button class="tab" data-tab="puzzle" data-group="ctrl" data-i18n="tab.puzzle">🧩 パズル</button>
        <button class="tab" data-tab="learn" data-group="ctrl" data-i18n="tab.learn">🎓 まなぶ</button>
      </nav>

      <!-- Settings / 設定 -->
      <div id="tab-settings" class="tab-page active" data-group="ctrl">
        <div class="settings">
          <label><span data-i18n="settings.graphics">グラフィック</span>
            <select id="sel-view">
              <option value="3d" data-i18n="settings.view3d">3Dモード(ドット絵)</option>
              <option value="simple" data-i18n="settings.viewSimple">シンプルモード</option>
            </select>
          </label>
          <label id="row-set"><span data-i18n="settings.pieceDesign">ピースのデザイン</span>
            <select id="sel-set"></select>
          </label>
          <label><span data-i18n="settings.opponent">あいて</span>
            <select id="sel-opponent">
              <option value="cpu" data-i18n="settings.cpu">コンピューター</option>
              <option value="2p" data-i18n="settings.twoPlayer">ふたりで遊ぶ</option>
            </select>
          </label>
          <label id="row-level"><span data-i18n="settings.cpuStrength">コンピューターの強さ(1〜10)</span>
            <select id="sel-level">
              <option value="1" data-i18n="settings.level1">Lv1 はじめて</option>
              <option value="2" data-i18n="settings.level2">Lv2 とてもやさしい</option>
              <option value="3" data-i18n="settings.level3">Lv3 やさしい</option>
              <option value="4" selected data-i18n="settings.level4">Lv4 すこしやさしい</option>
              <option value="5" data-i18n="settings.level5">Lv5 ふつう</option>
              <option value="6" data-i18n="settings.level6">Lv6 すこしつよい</option>
              <option value="7" data-i18n="settings.level7">Lv7 つよい</option>
              <option value="8" data-i18n="settings.level8">Lv8 かなりつよい</option>
              <option value="9" data-i18n="settings.level9">Lv9 とてもつよい</option>
              <option value="10" data-i18n="settings.level10">Lv10 さいきょう</option>
            </select>
          </label>
          <label id="row-color"><span data-i18n="settings.playerColor">じぶんの色</span>
            <select id="sel-color">
              <option value="w" data-i18n="settings.whiteFirst">しろ(先手)</option>
              <option value="b" data-i18n="settings.blackSecond">くろ(後手)</option>
            </select>
          </label>
          <label><span data-i18n="settings.bgm">BGM</span>
            <select id="sel-bgm"></select>
          </label>
          <label class="check-line"><input type="checkbox" id="chk-badges"> <span data-i18n="settings.showBadges">コマの種類記号を表示</span></label>
        </div>
        <div class="btn-row">
          <button id="btn-new" class="btn primary" data-i18n="button.newGame">🌱 新しいゲーム</button>
          <button id="btn-hint" class="btn" data-i18n="button.hint">💡 ヒント</button>
          <button id="btn-undo" class="btn" data-i18n="button.undo">↩️ 待った</button>
          <button id="btn-copy-pgn" class="btn" data-i18n="button.copyPgn">📋 棋譜コピー</button>
        </div>
      </div>

      <!-- Puzzles / パズル -->
      <div id="tab-puzzle" class="tab-page" data-group="ctrl">
        <div id="puzzle-info" class="puzzle-info">
          <div id="puzzle-title" class="puzzle-title"></div>
          <div id="puzzle-goal" class="puzzle-goal"></div>
        </div>
        <div class="btn-row">
          <button id="btn-puzzle-retry" class="btn" data-i18n="button.retry">🔄 さいしょから</button>
          <button id="btn-puzzle-hint" class="btn" data-i18n="button.hint">💡 ヒント</button>
        </div>
        <div id="puzzle-cats" class="chip-row"></div>
        <div id="puzzle-list" class="puzzle-list"></div>
      </div>

      <!-- Learn: openings, combinations, and endgames / まなぶ: オープニング・コンビネーション・エンドゲーム -->
      <div id="tab-learn" class="tab-page" data-group="ctrl">
        <p class="hint-text" data-i18n="learn.help">テーマを選ぶと、一手ずつ「なぜそう指すのか」を解説つきで学べます</p>
        <div id="learn-cats" class="chip-row"></div>
        <div id="learn-list" class="study-list"></div>
      </div>
    </section>

    <!-- Lower right: game-record card / 右下: 棋譜カード -->
    <section class="panel card-kifu">
      <nav class="tabs">
        <button class="tab active" data-tab="game" data-group="kifu" data-i18n="tab.currentGame">📜 この対局</button>
        <button class="tab" data-tab="games" data-group="kifu" data-i18n="tab.famousGames">🏆 名局</button>
        <button class="tab" data-tab="load" data-group="kifu" data-i18n="tab.load">📥 よみこみ</button>
      </nav>

      <!-- Current game record / この対局の棋譜 -->
      <div id="tab-game" class="tab-page active" data-group="kifu">
        <div class="movelist-wrap tall">
          <div class="movelist-title" data-i18n="ui.moveList">きふ</div>
          <ol id="movelist" class="movelist"></ol>
        </div>
      </div>

      <!-- Famous games with annotations / 名局。歴史的な名勝負を解説付きで表示。 -->
      <div id="tab-games" class="tab-page" data-group="kifu">
        <p class="hint-text" data-i18n="games.help">歴史に残る名勝負を、一手ずつ独自の解説つきで鑑賞できます</p>
        <div id="games-list" class="study-list tall"></div>
      </div>

      <!-- Load a game record / 棋譜読み込み -->
      <div id="tab-load" class="tab-page" data-group="kifu">
        <p class="hint-text" data-i18n="load.help">PGN形式の棋譜を貼り付けるか、ファイルを選んでね</p>
        <textarea id="pgn-input" rows="5" data-i18n-placeholder="load.placeholder" placeholder="1. e4 e5 2. Nf3 Nc6 ..."></textarea>
        <div class="btn-row">
          <button id="btn-load-pgn" class="btn primary" data-i18n="button.loadPgn">📥 読み込み</button>
          <label class="btn file-btn"><span data-i18n="button.file">📂 ファイル</span><input type="file" id="pgn-file" accept=".pgn,.txt" hidden></label>
          <button id="btn-sample-pgn" class="btn" data-i18n="button.samplePgn">✨ サンプル棋譜</button>
        </div>
        <p class="hint-text" data-i18n="load.helpAfter">読み込むと盤の下に再生パネルが出ます。手をクリックすればどこからでも再生できます。</p>
      </div>
    </section>

  </div>
</main>

<!-- Toast notifications / トースト表示 -->
<div id="toast-area" class="toast-area"></div>

<!-- Promotion selection / プロモーション選択 -->
<div id="promo-modal" class="modal hidden">
  <div class="modal-box">
    <p data-i18n="ui.promote">どのコマにへんしんする?</p>
    <div id="promo-choices" class="promo-choices"></div>
  </div>
</div>

<!-- Game-over dialog / ゲーム終了ダイアログ -->
<div id="gameover-modal" class="modal hidden">
  <div class="modal-box">
    <div id="gameover-emoji" class="gameover-emoji"></div>
    <p id="gameover-text"></p>
    <div class="btn-row center">
      <button id="btn-gameover-close" class="btn" data-i18n="ui.close">とじる</button>
      <button id="btn-gameover-new" class="btn primary" data-i18n="ui.playAgain">もういちど!</button>
    </div>
  </div>
</div>

<script src="js/chess.js?v=2"></script>
<script src="js/pieces.js?v=10"></script>
<script src="js/sprite_data.js?v=9"></script>
<script src="js/sprites.js?v=9"></script>
<script src="js/bgm.js?v=9"></script>
<script src="js/puzzles.js?v=14"></script>
<script src="js/puzzle_en.js?v=1"></script>
<script src="js/lessons.js?v=17"></script>
<script src="js/games.js?v=15"></script>
<script src="js/engine.js?v=17"></script>
<script src="js/i18n.js?v=1"></script>
<script src="js/app.js?v=14"></script>
</body>
</html>
