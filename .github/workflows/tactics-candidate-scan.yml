name: Temporary windmill candidate search
on:
  pull_request:
    paths:
      - 'tools/tactics_candidate_search.py'
      - '.github/workflows/tactics-candidate-scan.yml'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          python -m pip install 'python-chess==1.999'
      - run: python tools/tactics_candidate_search.py
