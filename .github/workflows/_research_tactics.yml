name: Temporary tactic candidate search
on:
  pull_request:
    paths:
      - 'tools/_research_tactics.py'
      - '.github/workflows/_research_tactics.yml'
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          python -m pip install 'python-chess==1.999'
      - run: python tools/_research_tactics.py
