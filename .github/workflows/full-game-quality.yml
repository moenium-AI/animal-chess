name: Full-game reliability
on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/style.css'
      - 'js/app.js'
      - 'js/sprites.js'
      - 'js/royal_carriage.js'
      - 'js/royal_sprite_start.js'
      - 'assets/scenery/royal-carriage-atlas.png'
      - 'tools/test_royal_carriage.cjs'
      - 'js/pixel_hd.js'
      - 'js/royal_sprite_loader.js'
      - 'js/royal_sprite_finish.js'
      - 'js/royal_sprite_start.js'
      - 'assets/pixel_royal/**'
      - 'tools/test_royal_sprite_art.cjs'
      - 'js/sprite_data.js'
      - 'tools/test_pixel_hd.cjs'
      - 'tools/test_piece_sprites.cjs'
      - 'js/intro_lessons.js'
      - 'js/extra_lessons.js'
      - 'js/lesson_comparisons.js'
      - 'tools/test_lesson_comparisons.cjs'
      - 'js/lessons.js'
      - 'js/games.js'
      - 'tools/test_course_expansion.cjs'
      - 'tools/test_chess_terminology.cjs'
      - 'tools/check_pixel_hd_source.py'
      - 'tools/test_pixel_hd_source_checker.py'
      - 'docs/pixel-hd-king-queen-pawn-rough-spec-2026-10-26.md'
      - 'tools/test_puzzle_theme_integrity.cjs'
      - 'js/learning.js'
      - 'js/i18n.js'
      - 'tools/test_intro_lessons.cjs'
      - 'js/engine.js'
      - 'js/engine_worker.js'
      - 'js/chess.js'
      - 'tools/test_full_game_browser.py'
      - 'tools/test_engine_search.cjs'
      - 'tools/compare_natural_ai.cjs'
      - 'tools/test_ai_calibration.cjs'
      - 'docs/ai-calibration-2026-10-24.json'
      - 'docs/ai-calibration-pilot-2026-10-24.json'
      - 'tools/audit_ai_balance.cjs'
      - 'tools/tournament_ai_levels.cjs'
      - 'tools/summarize_ai_tournament.cjs'
      - 'tools/test_tournament_ai_levels.cjs'
      - 'tools/summarize_full_time_ai.cjs'
      - 'tools/evaluate_ai_moves.cjs'
      - 'tools/test_ai_move_quality.cjs'
      - 'tools/test_full_time_ai.cjs'
      - '.github/workflows/full-time-ai-balance.yml'
      - 'docs/ai-selfplay-results-2026-10-24.json'
      - '.github/workflows/full-game-quality.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/style.css'
      - 'js/app.js'
      - 'js/sprites.js'
      - 'js/royal_carriage.js'
      - 'js/royal_sprite_start.js'
      - 'assets/scenery/royal-carriage-atlas.png'
      - 'tools/test_royal_carriage.cjs'
      - 'js/pixel_hd.js'
      - 'js/royal_sprite_loader.js'
      - 'js/royal_sprite_finish.js'
      - 'js/royal_sprite_start.js'
      - 'assets/pixel_royal/**'
      - 'tools/test_royal_sprite_art.cjs'
      - 'js/sprite_data.js'
      - 'tools/test_pixel_hd.cjs'
      - 'tools/test_piece_sprites.cjs'
      - 'js/intro_lessons.js'
      - 'js/extra_lessons.js'
      - 'js/lesson_comparisons.js'
      - 'tools/test_lesson_comparisons.cjs'
      - 'js/lessons.js'
      - 'js/games.js'
      - 'tools/test_course_expansion.cjs'
      - 'tools/test_chess_terminology.cjs'
      - 'tools/check_pixel_hd_source.py'
      - 'tools/test_pixel_hd_source_checker.py'
      - 'docs/pixel-hd-king-queen-pawn-rough-spec-2026-10-26.md'
      - 'tools/test_puzzle_theme_integrity.cjs'
      - 'js/learning.js'
      - 'js/i18n.js'
      - 'tools/test_intro_lessons.cjs'
      - 'js/engine.js'
      - 'js/engine_worker.js'
      - 'js/chess.js'
      - 'tools/test_full_game_browser.py'
      - 'tools/test_engine_search.cjs'
      - 'tools/compare_natural_ai.cjs'
      - 'tools/test_ai_calibration.cjs'
      - 'docs/ai-calibration-2026-10-24.json'
      - 'docs/ai-calibration-pilot-2026-10-24.json'
      - 'tools/audit_ai_balance.cjs'
      - 'tools/tournament_ai_levels.cjs'
      - 'tools/summarize_ai_tournament.cjs'
      - 'tools/test_tournament_ai_levels.cjs'
      - 'tools/summarize_full_time_ai.cjs'
      - 'tools/evaluate_ai_moves.cjs'
      - 'tools/test_ai_move_quality.cjs'
      - 'tools/test_full_time_ai.cjs'
      - '.github/workflows/full-time-ai-balance.yml'
      - 'docs/ai-selfplay-results-2026-10-24.json'
      - '.github/workflows/full-game-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JavaScript and game regressions
        run: |
          node --check js/app.js
          node --check js/engine.js
          node --check js/engine_worker.js
          node tools/test_engine_search.cjs
          node tools/test_ai_calibration.cjs
          node tools/summarize_ai_tournament.cjs docs/ai-calibration-pilot-2026-10-24.json > /dev/null
          node tools/test_tournament_ai_levels.cjs
          node tools/test_full_time_ai.cjs
          node tools/test_ai_move_quality.cjs
          node tools/summarize_ai_tournament.cjs docs/ai-selfplay-results-2026-10-24.json > /dev/null
          node tools/test_learning_async.cjs
          node tools/test_pixel_hd.cjs
          node tools/test_royal_sprite_art.cjs
          node tools/test_piece_sprites.cjs
          node tools/test_royal_carriage.cjs
          node tools/test_graphics_lifecycle.cjs
          node tools/test_puzzle_navigation.cjs
          node tools/test_learning_runtime.cjs
          node tools/test_intro_lessons.cjs
          node tools/test_course_expansion.cjs
          python tools/test_pixel_hd_source_checker.py
          node tools/test_lesson_comparisons.cjs
          node tools/audit_runtime.cjs
      - name: Compare natural play against previous engine
        run: node tools/compare_natural_ai.cjs
      - name: Install browser tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test real HTTP-served game and Web Worker
        env:
          ANIMAL_CHESS_USE_HTTP: '1'
        run: python tools/test_full_game_browser.py
